// [tema, pregunta, [opciones], índice correcto, retroalimentación]
const Q=[
["d","¿Qué virtualiza un contenedor Docker, a diferencia de una máquina virtual?",["Todo el hardware con un SO invitado completo","Solo el espacio de usuario (procesos y librerías), compartiendo el kernel del host","Únicamente la red","Solo el disco duro"],1,"Los contenedores aíslan procesos sobre el kernel compartido; la VM virtualiza hardware completo con su propio SO, por eso es más pesada y lenta."],
["d","¿Cuál es el tiempo de arranque típico de un contenedor?",["Varios minutos","Milisegundos o un par de segundos","Una hora","Depende del hipervisor"],1,"Un contenedor inicia solo el proceso, no todo un sistema operativo, por eso arranca casi al instante."],
["d","¿Cuál de estos es un problema de instalar las BD directamente en el SO?",["Falta de memoria RAM siempre","Conflicto de versiones, colisión de puertos y diferencias entre sistemas","No se pueden usar clientes como DBeaver","Las BD no funcionan en Windows"],1,"Ej.: PostgreSQL 14 vs 16, el puerto 5432 ocupado y rutas distintas entre Windows y Linux. Docker da entornos idénticos y desechables."],
["d","¿Qué es una imagen de Docker?",["Un proceso activo con su propia IP","Una plantilla inmutable de solo lectura de la que nacen los contenedores","Un directorio persistente en el host","Un archivo de red"],1,"La imagen es la receta (como una Clase en POO); no consume CPU ni RAM mientras no se ejecute."],
["d","Con la analogía de POO, ¿qué es el contenedor?",["La clase","El objeto instanciado en ejecución","El compilador","El paquete npm"],1,"El contenedor es la instancia viva: agrega una capa escribible sobre la imagen. De una imagen puedes crear muchos contenedores independientes."],
["d","Si ejecutas docker rm sobre un contenedor de PostgreSQL SIN volumen, ¿qué pasa con los datos?",["Se conservan en el host","Se pierden las tablas y registros","Se mueven a Docker Hub","Se respaldan automáticamente"],1,"Sin volumen, los datos viven en la capa escribible del contenedor, que es efímera y desaparece con él."],
["d","¿Para qué sirve un volumen nombrado, por ejemplo -v pg_datos:/var/lib/postgresql/data?",["Para acelerar la red","Para persistir los datos fuera del ciclo de vida del contenedor","Para construir imágenes","Para exponer puertos"],1,"El volumen conserva la información aunque borres o actualices el contenedor. Regla de oro: el estado de las BD siempre vive en el volumen."],
["d","En -p 5433:5432, ¿qué significa el primer número?",["Puerto interno del contenedor","Puerto del host (tu PC) por el que te conectas","Versión de PostgreSQL","Número de réplicas"],1,"Formato -p HOST:CONTENEDOR. Te conectas a localhost:5433, y dentro del contenedor PostgreSQL sigue escuchando en 5432."],
["d","¿Cuál es el puerto estándar de MongoDB?",["5432","3306","27017","4000"],2,"PostgreSQL usa 5432, MySQL 3306, MongoDB 27017 y Nginx 80/443."],
["d","¿Cuál es el rol de Nginx como proxy inverso?",["Almacenar los datos","Ser el portero único que recibe tráfico en 80/443 y lo enruta, protegiendo las BD","Reemplazar a Docker Compose","Compilar el Dockerfile"],1,"Las BD quedan tras la red interna sin exponer el 5432 a internet; además Nginx aporta terminación SSL y caché de estáticos."],
["d","¿Qué comando levanta todos los servicios definidos en compose.yaml en segundo plano?",["docker run -a","docker compose up -d","docker build -t","docker ps -q"],1,"docker compose up -d levanta el stack; con --build fuerza a reconstruir las imágenes."],
["d","¿Cuándo se usan Dockerfile y Compose juntos?",["Nunca, son excluyentes","Cuando tu API se construye con build: ./backend y Compose la une con imágenes oficiales como Postgres y Mongo","Solo para Kubernetes","Solo en producción de Netflix"],1,"Dockerfile = receta de TU app; compose.yaml = el banquete completo. Es el estándar profesional full-stack."],
["o","¿Qué significa OLAP?",["Online Analytical Processing","Open Language Access Protocol","Operational Local Application Process","Online Archive Planning"],0,"Procesamiento Analítico en Línea: consultas complejas y agregaciones multidimensionales rápidas sin tocar la base transaccional."],
["o","¿Por qué las consultas pesadas congelaban las cajas registradoras?",["Falta de internet","Los reportes en la BD operacional (OLTP) generan bloqueos (locks) que impiden registrar tickets","MySQL no suma","Faltaba Excel"],1,"OLTP está hecho para cobrar rápido; por eso el análisis se separa en un servidor OLAP independiente."],
["o","¿Cuál es el flujo correcto de los datos?",["OLAP → ETL → OLTP","OLTP → ETL → OLAP","ETL → OLAP → OLTP","OLTP → OLAP → ETL"],1,"ETL (Extract, Transform, Load) extrae de OLTP, limpia, pre-calcula sumas y carga en el cubo."],
["o","¿Qué es una dimensión?",["Un valor numérico a sumar","El contexto o eje de análisis: ¿Quién? ¿Dónde? ¿Cuándo? ¿Qué producto?","Una fila de la tabla de hechos","Un tipo de índice"],1,"Las dimensiones dan contexto cualitativo; las métricas (hechos) son los números que se miden."],
["o","¿Qué operación OLAP fija UNA sola dimensión (ej. Sucursal = 'Santa Ana')?",["Dice","Pivot","Slice","Roll-Up"],2,"Slice (rebanar) fija una dimensión y colapsa el cubo 3D a una matriz 2D. Dice filtra varias dimensiones a la vez."],
["o","Pasar de ventas del Año → Mes → Día es una operación de:",["Roll-Up","Drill-Down","Pivot","Slice"],1,"Drill-Down profundiza en la jerarquía (zoom in). Roll-Up hace lo inverso: consolida hacia totales mayores."],
["o","¿Qué hace la operación Pivot?",["Filtra por rangos","Rota los ejes, intercambiando filas por columnas","Suma hasta el total país","Borra una dimensión"],1,"Pivot gira la orientación del reporte para ofrecer otra perspectiva, como girar la mesa."],
["o","Según Kimball, ¿cuál es el grano ideal?",["El resumen mensual","El más atómico posible (ej. una línea de producto escaneada en el ticket)","El promedio anual","El total del ticket"],1,"Resumir antes de tiempo destruye el detalle e impide responder preguntas futuras por hora, cajero o producto."],
["o","¿Por qué el saldo bancario es SEMIADITIVO?",["No se suma entre cuentas","Se suma entre cuentas, pero sumarlo a través del tiempo crearía dinero falso","Solo se guarda en dólares","Es un porcentaje"],1,"Las semiaditivas no se suman en el tiempo. Las no aditivas (%, promedios, precio unitario) no se suman nunca."],
["o","¿Cuál es el orden de los 4 pasos de Kimball para levantar requisitos?",["Dimensiones, hechos, grano, proceso","Proceso de negocio, grano, dimensiones, hechos","Grano, hechos, proceso, dimensiones","Hechos, dimensiones, proceso, grano"],1,"Proceso de negocio → declarar el grano (paso crítico) → dimensiones → hechos y métricas."],
["o","¿Qué diferencia a Inmon de Kimball?",["Inmon es Bottom-Up con datamarts; Kimball es Top-Down","Inmon propone un DW corporativo normalizado Top-Down; Kimball, datamarts dimensionales Bottom-Up","Son idénticos","Inmon no usa bases de datos"],1,"Inmon: primero el warehouse central en 3FN. Kimball: primero cubos/datamarts temáticos conectados por dimensiones conformadas."],
["m","¿Cuál es el propósito de la Minería de Datos?",["Almacenar transacciones","Descubrir patrones ocultos en grandes volúmenes de datos","Hacer copias de seguridad","Diseñar interfaces"],1,"Extrae regularidades no programadas manualmente, como que quien compra galletas suele llevar chocolates."],
["m","¿Cuáles son las 3 fases del proceso de minería de datos del curso?",["Ingesta, Algoritmos, Producción","Diseño, Pruebas, Despliegue","Backup, Restore, Mantenimiento","Consulta, Índice, Caché"],0,"Fase 1 Ingesta (MongoDB), Fase 2 Algoritmos (análisis y extracción), Fase 3 Producción (interpretación y decisión)."],
["m","¿Es lo mismo un find() o $match que la minería de datos?",["Sí, son equivalentes","No: la consulta busca lo que el programador define; la minería descubre relaciones ocultas","Sí, pero con más datos","No, la minería solo borra datos"],1,"La BD nos dice qué ocurrió; la minería descubre patrones en lo ocurrido."],
["m","Agrupar clientes en segmentos por similitud SIN etiquetas previas es:",["Clasificación","Clustering (no supervisado)","Regresión","Detección de errores"],1,"El clustering descubre grupos naturales (ej. K-Means). La clasificación es supervisada y usa categorías ya conocidas."],
["m","¿Qué función detecta que 'quien compra café suele llevar pan dulce'?",["Reglas de asociación","Detección de anomalías","Regresión lineal","Clustering"],0,"Las reglas de asociación modelan co-ocurrencia con las métricas de Soporte y Confianza."],
["m","Una transferencia de $1,900 a las 3:15 AM desde una IP desconocida, cuando el usuario gasta $5–$35, es un caso de:",["Clustering","Detección de anomalías","Regla de asociación","Regresión"],1,"Es un registro atípico respecto al perfil normal; el sistema puede suspenderlo y pedir autenticación de dos factores."],
["m","¿Cuáles funciones de minería son descriptivas?",["Solo el modelado predictivo","Agrupamiento, asociación y anomalías","Ninguna","Todas son predictivas"],1,"Las funciones 1–3 explican la estructura de los datos actuales; la función 4 (modelado predictivo) proyecta hacia el futuro."],
["m","¿Qué técnica sirve para estimar cantidades numéricas continuas, como ventas del próximo sábado?",["Regresión lineal","Regresión logística","Clustering","Reglas de asociación"],0,"La regresión estima valores continuos; la regresión logística estima probabilidades de categorías (ej. ¿cancela o no?)."],
["m","Una predicción es:",["Una certeza absoluta","Una estimación probabilística basada en datos históricos","Un dato ya ocurrido","Un respaldo de la BD"],1,"No es una certeza determinista: es un valor esperado con un intervalo de confianza."],
["m","¿Qué significa GIGO?",["Get In, Get Out","Garbage In, Garbage Out: datos de mala calidad generan patrones distorsionados","Graph In, Graph Out","General Input, General Output"],1,"Por eso el preprocesamiento y la limpieza en MongoDB pueden llegar al 70% del esfuerzo del proyecto."],
["m","¿Qué papel cumple MongoDB en un proyecto de minería?",["Ejecuta K-Means por sí solo","Persiste los datos y los prepara con el Aggregation Pipeline; el algoritmo corre aparte (ej. scikit-learn)","Reemplaza al algoritmo","Solo sirve para gráficos"],1,"MongoDB no agrupa por sí solo: se conecta un algoritmo que procese los datos y devuelva reglas o clústeres que la app consume."],
["m","¿Qué se hace en la fase de Evaluar del ciclo predictivo?",["Se compara el modelo con datos de prueba que nunca vio (RMSE / R²)","Se recopilan los datos","Se borran los nulos","Se publica el modelo"],0,"Ciclo: recopilar, preparar, entrenar, evaluar y predecir. Evaluar mide si el modelo generaliza."],
["d","¿Qué comando muestra TODOS los contenedores, incluso los detenidos?",["docker ps","docker ps -a","docker images","docker logs -f"],1,"docker ps solo lista los que corren; con -a aparecen también los detenidos. docker images lista las imágenes descargadas."],
["d","¿Qué hace docker stop nombre_contenedor?",["Lo borra","Lo detiene sin borrarlo","Borra su imagen","Reconstruye la imagen"],1,"stop solo lo detiene; para borrarlo se usa docker rm (debe estar detenido, o rm -f para forzar)."],
["d","¿Qué comando elimina una imagen, por ejemplo postgres:16-alpine?",["docker rm","docker rmi","docker stop","docker prune"],1,"docker rmi borra imágenes; docker rm borra contenedores."],
["d","¿Qué hace la bandera -d en docker run -d?",["Elimina el contenedor al salir","Lo ejecuta en segundo plano (detached)","Descarga la imagen de nuevo","Define el puerto"],1,"-d libera la terminal y deja el contenedor corriendo en segundo plano."],
["d","¿Cómo reconstruyes la imagen y reinicias los servicios cuando cambias el Dockerfile con Compose?",["docker compose stop","docker compose up -d --build","docker rmi -a","docker pull"],1,"--build fuerza a recompilar la imagen aunque no haya cambiado la versión."],
["d","¿Qué comando construye una imagen propia desde un Dockerfile?",["docker build -t mi_app:latest .","docker pull mi_app","docker start mi_app","docker logs mi_app"],0,"docker build -t le pone nombre (tag) a la imagen y el punto indica el contexto: la carpeta actual."],
["d","¿Qué es un Dockerfile?",["Un archivo con instrucciones paso a paso para construir una imagen propia","Un archivo que levanta varios servicios","Un volumen","Un servidor web"],0,"Dockerfile = la receta de cocina de TU app (FROM, WORKDIR, COPY, RUN, CMD)."],
["d","¿Qué instrucción de un Dockerfile define la imagen base, como node:20-alpine?",["WORKDIR","COPY","FROM","CMD"],2,"FROM indica la imagen sobre la que se construye. WORKDIR fija la carpeta de trabajo y CMD el comando de arranque."],
["d","¿Cuándo basta con usar solo docker-compose y no un Dockerfile?",["Cuando solo consumes imágenes oficiales listas (Postgres, Mongo, Redis)","Cuando compilas tu propio código","Nunca","Solo con Kubernetes"],0,"Si no hay código propio que empaquetar, Compose con image: es suficiente."],
["d","¿Qué es Kubernetes (K8s)?",["Un sistema de Google para orquestar contenedores en clústeres de cientos o miles de servidores","Una base de datos NoSQL","Un cliente gráfico de BD","Un tipo de volumen"],0,"Ofrece auto-recuperación y auto-escalado, y lo usan Netflix y Spotify."],
["d","¿Por qué en el curso usamos Docker Compose y no Kubernetes?",["Porque K8s es de pago","Porque K8s añade una sobrecarga enorme (Pods, Ingress, Helm) innecesaria para laboratorio; Compose es más directo y suficiente","Porque Compose escala a miles de nodos","Porque K8s no usa contenedores"],1,"La regla de ingeniería: no uses una grúa industrial si solo necesitas mover una silla."],
["d","Dos contenedores en la misma red Docker, ¿cómo se comunican entre sí?",["Solo por IP pública","Directamente por su nombre DNS interno (ej. postgres:5432), sin exponer puertos a internet","Necesitan Nginx","No pueden comunicarse"],1,"Por eso la API se conecta a postgres-db y mongo-db sin publicar sus puertos."],
["d","En el stack del curso, ¿qué contenedor debe exponer puertos al exterior (80/443)?",["PostgreSQL","MongoDB","Nginx (el proxy inverso)","Ninguno"],2,"Nginx es la única entrada pública; las BD quedan en la red privada."],
["d","Quieres correr dos PostgreSQL en la misma laptop. ¿Qué mapeo es correcto?",["Ambos \"5432:5432\"","\"5432:5432\" y \"5433:5432\"","\"5432:5433\" en ambos","No se puede"],1,"Cambia el puerto del host; el interno sigue siendo 5432 porque lo define la imagen. Dos \"5432:5432\" causan colisión."],
["d","Un contenedor SIN la sección ports: en compose, ¿quién puede acceder a él?",["Cualquiera en internet","Solo los contenedores de su misma red Docker interna","Nadie, ni la API","Solo el host"],1,"No es inaccesible: está oculto al exterior pero visible dentro de la red, que es justo lo deseado para las BD."],
["d","¿Qué error cometió la fintech del Reto C?",["Usó volúmenes","Publicó 5432 y 27017 directamente a internet, y un bot robó los datos","Usó Nginx","Usó imágenes oficiales"],1,"Se confundió red Docker interna con exposición pública. La solución: solo Nginx publica 80/443."],
["d","¿Qué beneficio da la terminación SSL en Nginx?",["Cifra los datos del disco","El certificado HTTPS se configura una sola vez en Nginx sin tocar los contenedores internos","Hace más rápidas las consultas SQL","Evita usar volúmenes"],1,"Los contenedores internos siguen hablando HTTP simple por la red privada."],
["d","En el Dockerfile multi-stage del Reto D, ¿para qué sirve?",["Para tener más contenedores","Para obtener una imagen final liviana que haga deploys más rápidos","Para usar dos bases de datos","Para exponer más puertos"],1,"La etapa builder instala dependencias y la final copia solo lo necesario."],
["d","En la arquitectura analítica del curso, ¿qué rol cumple Cube Core?",["Capa semántica con métricas gobernadas y caché analítica (puerto 4000)","Base transaccional","Proxy inverso","Gestor de volúmenes"],0,"Flujo: Fuentes → ETL → DW PostgreSQL (estrella) → Cube Core → Nginx y Dashboard."],
["d","¿Cuál es la \"Regla de Oro\" de las BD en Docker?",["Los contenedores no deben destruirse nunca","Los contenedores se pueden destruir o actualizar en cualquier momento; el estado vive en el volumen","Usar siempre la imagen latest","Exponer todos los puertos"],1,"Contenedores desechables + datos en volúmenes."],
["o","¿Qué es un Data Warehouse?",["Un repositorio central que integra y almacena datos históricos de múltiples sistemas","Una hoja de cálculo","Una base solo de cajeros","Un tipo de índice"],0,"Integra, limpia y guarda históricos para análisis estratégico unificado."],
["o","¿Qué es un Datamart?",["Un subconjunto temático del warehouse enfocado en un área (Mercadeo, Finanzas…)","El warehouse completo","Una tabla de hechos","Una copia de OLTP"],0,"Ej.: base analítica exclusiva de Mercadeo para evaluar promociones."],
["o","¿Qué almacena ROLAP?",["Matrices binarias precalculadas","Datos en tablas de motores relacionales (SQL)","Solo texto plano","Solo agregaciones en RAM"],1,"ROLAP = Relational OLAP; ej.: cubo virtual sobre PostgreSQL o MySQL usando vistas y agregaciones SQL."],
["o","¿Qué caracteriza a MOLAP?",["Guarda datos en matrices multidimensionales precalculadas, con máxima velocidad de lectura","Usa solo tablas relacionales","Es siempre más barato","No usa agregaciones"],0,"Ej.: cubos de Microsoft SSAS cargados en memoria para tableros ejecutivos."],
["o","¿Qué combina HOLAP?",["MOLAP para agregaciones de alto nivel y ROLAP para el detalle atómico","Dos bases NoSQL","OLTP con ETL","Dos cubos MOLAP"],0,"Híbrido: los resúmenes salen al instante y el ticket del día se consulta en la base relacional."],

// Preguntas para ESCRIBIR: [tema, pregunta, [respuestas aceptadas], respuesta mostrada, retroalimentación]
const QT=[

// ---------- lógica ----------
const $=id=>document.getElementById(id);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sc=x=>$(x).classList;
const norm=s=>s.toLowerCase().replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/`/g,"").replace(/\s+/g," ").trim().replace(/[.;]+$/,"");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ALL=[...Q.map(q=>({tema:q[0],q:q[1],raw:q[2],c:q[3],fb:q[4]})),...QT.map(q=>({tema:q[0],q:q[1],acc:q[2],ans:q[3],fb:q[4],typed:true}))];
let L=[],i=0,last={topics:[]};
const tp=$("topics");
Object.keys(T).forEach(k=>{const a=ALL.filter(q=>q.tema==k),t=a.filter(q=>q.typed).length;tp.insertAdjacentHTML("beforeend",`<label class="tp"><input type="checkbox" value="${k}" checked><span><b>${T[k]}</b> <span class="mono">(${a.length} preguntas, ${t} de escribir)</span></span></label>`)});
const sel=()=>[...tp.querySelectorAll("input:checked")].map(x=>x.value);
function upd(){const n=ALL.filter(q=>sel().includes(q.tema)).length;$("cnt").textContent=n+" preguntas seleccionadas";$("go").disabled=$("goo").disabled=!n}
tp.onchange=upd;upd();
function screen(n){["home","quiz","stats"].forEach(x=>sc(x).toggle("hide",x!=n));sc("foot").toggle("hide",n=="home")}
function start(topics,mix,only){
 last={topics,mix};
 let items=only||ALL.filter(q=>topics.includes(q.tema));
 if(mix)items=sh(items);
 L=items.map(x=>x.typed?{...x,val:"",done:false,ok:false}:{...x,o:sh(x.raw.map((t,k)=>({t,c:k==x.c}))),pick:null,done:false});
 i=0;screen("quiz");show()}
$("go").onclick=()=>start(sel(),true);$("goo").onclick=()=>start(sel(),false);
const good=x=>x.done&&(x.typed?x.ok:x.o[x.pick].c);
const rightOf=x=>x.typed?x.ans:x.o.find(o=>o.c).t;
function show(){
 const x=L[i],n=L.filter(good).length;
 $("pos").textContent=`Pregunta ${i+1} de ${L.length}`;$("okc").textContent=`${n} correctas`;
 $("tag").textContent=T[x.tema]+(x.typed?" · escribe la respuesta":"");$("q").textContent=x.q;
 const box=$("opts");box.innerHTML="";
 if(x.typed){
  const inp=document.createElement("input");inp.className="inp"+(x.done?(x.ok?" ok":" no"):"");inp.placeholder="Escribe aquí tu respuesta…";
  inp.value=x.val;inp.readOnly=x.done;inp.autocomplete="off";inp.spellcheck=false;
  inp.oninput=()=>{x.val=inp.value;$("conf").disabled=!inp.value.trim()};
  inp.onkeydown=e=>{if(e.key=="Enter"&&!x.done&&inp.value.trim())confirmar()};
  box.appendChild(inp);if(!x.done)setTimeout(()=>inp.focus(),0);
 }else x.o.forEach((op,k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML='<span class="r"></span>';b.append(op.t);
  if(x.done){b.disabled=true;if(op.c)b.classList.add("ok");else if(k==x.pick)b.classList.add("no")}
  else{if(k==x.pick)b.classList.add("sel");b.onclick=()=>{x.pick=k;show()}}
  box.appendChild(b)});
 const ok=good(x);
 $("fb").innerHTML=x.done?`<div class="fb ${ok?"ok":"no"}"><b>${ok?"¡Correcto!":"Incorrecto."}</b>${ok?"":" Respuesta correcta: <i>"+esc(rightOf(x))+"</i>"}<p>${x.fb}</p></div>`:"";
 $("conf").classList.toggle("hide",x.done);$("conf").disabled=x.typed?!x.val.trim():x.pick===null;
 $("prev").disabled=i==0;$("next").disabled=!x.done;$("next").textContent=i==L.length-1?"Ver resultados":"Siguiente"}
function confirmar(){const x=L[i];if(x.typed)x.ok=x.acc.map(norm).includes(norm(x.val));x.done=true;show()}
$("conf").onclick=confirmar;
$("prev").onclick=()=>{i--;show()};
$("next").onclick=()=>{if(i<L.length-1){i++;show()}else stats(true)};
function stats(fin){
 const d=L.filter(x=>x.done),ok=d.filter(good).length,bad=d.length-ok,pend=L.length-d.length,pc=d.length?Math.round(ok/d.length*100):0;
 const tt=d.filter(x=>x.typed),to=tt.filter(good).length,mc=d.filter(x=>!x.typed),mo=mc.filter(good).length;
 const por=Object.keys(T).filter(k=>L.some(x=>x.tema==k)).map(k=>{const a=L.filter(x=>x.tema==k&&x.done),g=a.filter(good).length,p=a.length?Math.round(g/a.length*100):0;
  return `<div class="tr"><span>${T[k]}</span><span>${g}/${a.length} · ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div>`}).join("");
 const fails=d.filter(x=>!good(x));
 const msg=!d.length?"Aún no has respondido nada.":pc>=90?"¡Excelente dominio!":pc>=70?"¡Muy bien! Repasa lo que fallaste.":pc>=50?"Vas bien, sigue practicando.":"Toca repasar un poco más, ¡tú puedes!";
 $("stats").innerHTML=`<div class="mono">${fin?"RESULTADO FINAL":"PUNTUACIÓN ACTUAL"}</div><hr>
 <div style="text-align:center"><div class="big">${ok} / ${d.length}</div><div class="mono">${pc}% de aciertos · ${msg}</div></div>
 <div class="st"><div><b style="color:var(--ok)">${ok}</b>Buenas</div><div><b style="color:var(--no)">${bad}</b>Malas</div><div><b>${pend}</b>Sin responder</div></div>
 <p class="mono">POR TIPO</p><div class="tr"><span>Opción múltiple</span><span>${mo}/${mc.length}</span></div><div class="tr"><span>Escritas (comandos y términos)</span><span>${to}/${tt.length}</span></div>
 <p class="mono">POR TEMA</p>${por}
 ${fails.length?`<p class="mono">PREGUNTAS FALLADAS (${fails.length})</p>`+fails.map(x=>`<div class="rv">${esc(x.q)}<br>${x.typed?`<small>Tu respuesta: ${esc(x.val)}</small><br>`:""}<span>✔ ${esc(rightOf(x))}</span></div>`).join(""):(d.length?'<p class="mono">¡Sin errores! 🎉</p>':"")}
 <div class="row">${fin?"":'<button class="bt" id="back">Volver al cuestionario</button>'}${fails.length?'<button class="bt" id="rep">Repetir solo las falladas</button>':""}</div>`;
 screen("stats");
 if($("back"))$("back").onclick=()=>{screen("quiz");show()};
 if($("rep"))$("rep").onclick=()=>start(last.topics,true,fails.map(x=>{const{o,pick,val,ok,done,...r}=x;return r}))}
$("bo").onclick=()=>start(last.topics,false);$("bm").onclick=()=>start(last.topics,true);
$("bs").onclick=()=>stats(false);$("bh").onclick=()=>screen("home");
</script></body></html>
